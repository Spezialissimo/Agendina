packages:
  - apps/*
  - packages/*

# Versions shared by several packages, kept in one place so they cannot drift apart. Packages
# refer to them as "catalog:". @playwright/test (e2e) and playwright (browser tests) must stay
# equal so both use the same installed browsers; ci.yml's Playwright container tag follows them.
catalog:
  '@playwright/test': 1.64.1
  '@types/node': 26.6.5
  '@vitest/browser': 5.0.5
  '@vitest/browser-playwright': 5.0.5
  fast-check: 4.10.2
  kysely: 0.29.7
  playwright: 1.64.1
  vitest: 5.0.5
  zod: 4.6.7

allowBuilds:
  esbuild: true
