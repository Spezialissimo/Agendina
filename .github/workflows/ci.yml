name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: End-to-end (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system packages are preinstalled in this image, so the job does not
    # depend on the (sometimes very slow) Ubuntu package mirror. Keep the tag equal to the
    # installed @playwright/test version; the "Check the container" step enforces it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the container matches @playwright/test
        run: test "$(pnpm exec playwright --version)" = "Version 1.64.1"
      - name: Editor tests in a real browser
        run: pnpm test:browser
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agendina:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name agendina -p 3000:3000 agendina:ci
          for i in $(seq 1 20); do curl -sf localhost:3000/api/health && break; sleep 1; done
          # Signing up exercises the bundled database drivers, migrations and password hashing.
          curl -sf -H 'content-type: application/json' -H 'origin: http://localhost:3000' \
            -d '{"email":"ci@example.com","password":"correct horse battery"}' \
            localhost:3000/api/auth/signup || { docker logs agendina; exit 1; }
