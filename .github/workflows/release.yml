name: Release

# Pushing a tag like v0.1.0 publishes the Docker image to the GitHub Container Registry as
# ghcr.io/<owner>/agendina:0.1.0, :0.1 and :latest, for amd64 and arm64 (e.g. a Raspberry Pi).
on:
  push:
    tags: ['v*']

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        # Registry names must be lowercase.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agendina:release
          build-args: AGENDINA_VERSION=${{ steps.meta.outputs.version }}
      - name: Smoke test
        run: scripts/docker-smoke-test.sh agendina:release
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AGENDINA_VERSION=${{ steps.meta.outputs.version }}
